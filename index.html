            {filteredProjects.map((project) => {
              // 判斷 Firebase 是否有資料，有則覆蓋，無則用預設
              const finalStatuses = dynamicData[project.id]?.activeStatuses ? dynamicData[project.id].activeStatuses : project.activeStatuses;
              
              // 優先讀取 Firebase 網址，若無則讀取本機設定的靜態圖片檔名
              const imageUrl = dynamicData[project.id]?.imageUrl || project.imageUrl || '';

              return (
                <article key={project.id} className={`bg-white rounded-2xl border ${project.color} p-6 shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col h-full`}>
                  <div className="flex justify-between items-start mb-3">
                    <span className={`inline-block px-3 py-1.5 text-sm font-bold rounded-md ${project.badgeColor}`}>
                      專案代碼: {project.code}
                    </span>
                  </div>
                  <div className="mb-4">
                    <h2 className="text-2xl font-bold text-gray-900 mb-1">{project.title}</h2>
                    <p className="text-base font-medium text-gray-500 italic">{project.enTitle}</p>
                  </div>

                  {/* 🖼️ 新增：圖片顯示區塊 (連線至 Firebase) */}
                  <div className="mb-5 relative w-full h-48 bg-gray-100/80 rounded-xl overflow-hidden border border-gray-100 group flex items-center justify-center">
                    {imageUrl ? (
                      <img src={imageUrl} alt={project.title} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                    ) : (
                      <div className="flex flex-col items-center text-gray-400">
                         <Icons.ImageIcon className="w-10 h-10 mb-2 opacity-40" />
                         <span className="text-xs font-bold tracking-wider">圖片準備中</span>
                      </div>
                    )}
                  </div>

                  <div className="mb-5 rounded-lg p-3 border bg-gray-50/80 border-gray-200">
                    <div className="text-sm font-bold text-gray-500 mb-2">可報名狀態：</div>
                    
                    {!project.hideDefaultStatuses && (
                      <div className="flex flex-wrap gap-2">
                        {allStatuses.map(status => {
                          const isActive = finalStatuses.includes(status.id);
                          return (
                            <div key={status.id} className={`flex items-center px-2.5 py-1.5 rounded-md text-xs font-bold border transition-all ${isActive ? status.activeBg + ' border-transparent' : 'bg-white border-gray-200'}`}>
                              <span className={`w-2 h-2 rounded-full mr-1.5 ${isActive ? status.activeDot + (!status.noPulse ? ' animate-pulse' : '') : 'bg-gray-300'}`}></span>
                              <span className={isActive ? status.activeText : 'text-gray-400'}>{status.label}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                    
                    {project.customNotices && (
                      <div className={`space-y-1.5 ${!project.hideDefaultStatuses ? 'mt-3 pt-3 border-t border-gray-200' : ''}`}>
                        {project.customNotices.map((notice, idx) => (
                          <div key={idx} className={`flex items-start text-xs font-bold ${project.iconColor}`}>
                            <Icons.Info className="w-4 h-4 mr-1.5 flex-shrink-0 mt-0.5" />
                            <span>{notice}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="mb-6 flex-grow">
                    <h3 className="flex items-center text-base font-bold text-gray-700 mb-2">
                      <Icons.Target className={`w-5 h-5 mr-1.5 ${project.iconColor}`} /> 核心理念
                    </h3>
                    <p className="text-base text-gray-700 leading-relaxed bg-white/80 p-4 rounded-lg border border-gray-100">{project.concept}</p>
                  </div>

                  <ul className="space-y-4 mb-6 bg-gray-50 rounded-xl p-5 border border-gray-100">
                    <li className="flex items-start">
                      <Icons.Clock className={`w-5 h-5 mr-2.5 mt-0.5 flex-shrink-0 ${project.iconColor}`} />
                      <span className="text-base text-gray-700"><strong className="font-semibold text-gray-900">規格：</strong>{project.specs}</span>
                    </li>
                    <li className="flex items-start">
                      <Icons.Mic className={`w-5 h-5 mr-2.5 mt-0.5 flex-shrink-0 ${project.iconColor}`} />
                      <span className="text-base text-gray-700"><strong className="font-semibold text-gray-900">講師：</strong>{project.instructor}</span>
                    </li>
                    <li className="flex items-start">
                      <Icons.DollarSign className={`w-5 h-5 mr-2.5 mt-0.5 flex-shrink-0 ${project.iconColor}`} />
                      <span className="text-base text-gray-700"><strong className="font-semibold text-gray-900">費用：</strong>{project.cost}</span>
                    </li>
                  </ul>

                  <div className="mt-auto border-t border-gray-200 pt-5">
                    <h3 className="flex items-center text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">
                      <Icons.Globe className="w-4 h-4 mr-1.5" /> SDGs / GRI 對應指標
                    </h3>
                    <div className="flex flex-wrap gap-2.5">
                      {project.esg.map((item, index) => (
                        <span key={index} className={`inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium ${project.badgeColor} bg-opacity-70`}>{item}</span>
                      ))}
                    </div>
                  </div>

                  <button onClick={() => handleInquiryClick(project)} className="mt-5 w-full flex items-center justify-center py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold transition-colors shadow-sm">
                    <Icons.MessageCircle className="w-5 h-5 mr-2" /> 報名詢問 (Messenger)
                  </button>
                </article>
              );
            })}
          </main>

          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-6 py-3 rounded-full shadow-2xl flex items-center z-50 animate-bounce whitespace-nowrap">
              <Icons.CheckCircle className="w-5 h-5 mr-2 text-green-400" />
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
